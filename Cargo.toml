[package]
name = "modulino-driver"
version = "0.1.0-dev"
edition = "2021"
authors = ["Mariusz Jurgielewicz <mordor@mail.com>"]
description = "A layered, hardware-agnostic no_std driver for Arduino Modulino boards"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CameronBrooks11/modulino-driver"
readme = "README.md"
keywords = ["embedded", "i2c", "arduino", "modulino", "no_std"]
categories = ["embedded", "no-std", "hardware-support"]
rust-version = "1.75"

[dependencies]
embedded-hal = "1.0"

[dev-dependencies]
embedded-hal-mock = "0.11"
toml = { version = "0.9.6", default-features = false, features = ["parse", "serde"] }

# The bench example talks to real boards through Linux's I2C device files.
# Only its I2C support: the default serial feature needs libudev.
[target.'cfg(target_os = "linux")'.dev-dependencies]
linux-embedded-hal = { version = "0.5", default-features = false, features = ["i2c"] }

# Run the bench example's own tests (its bus adapter) under `cargo test`.
[[example]]
name = "bench"
test = true

[features]
default = []
# Enable defmt debug formatting
defmt = ["dep:defmt"]

[dependencies.defmt]
version = "0.3"
optional = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
