# Codec vectors for Modulino LED Matrix (spec/nodes.toml kind "led_matrix").
#
# The matrix is 12 columns by 8 rows.
# decode_mode: read payload -> "mono" for "MON", "grayscale" for "GS4",
# "unknown" otherwise (main.c:506-516).
# encode_mode_command: target mode, padded with zeros to `len`, the length
# of the board's current mode (main.c:324-338, 555-556).
# encode_mono: pixels that are on, by row and column -> 12 bytes, one per
# column, bit `row` (matrix.c:234-262).
# encode_gray: levels by row and column (others 0) -> 48 bytes, LED
# row * 12 + col, even LED in the high nibble (matrix.c:211-233).
# A picture that starts with a firmware command prefix is marked
# `node = "reserved_prefix"`; one that starts "GS4" or "MON", which the board
# takes as a mode switch, is marked `device = "mode_command"`.

[[decode_mode]]
input = [0x4D, 0x4F, 0x4E]
expect = "mono"

[[decode_mode]]
input = [0x47, 0x53, 0x34]
expect = "grayscale"

[[decode_mode]]
input = [0x00, 0x00, 0x00]
expect = "unknown"

[[encode_mode_command]]
args = { target = "grayscale", len = 12 }
expect = [0x47, 0x53, 0x34, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

[[encode_mode_command]]
args = { target = "mono", len = 12 }
expect = [0x4D, 0x4F, 0x4E, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

[[encode_mode_command]]
args = { target = "grayscale", len = 48 }
expect = [0x47, 0x53, 0x34, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

[[encode_mode_command]]
