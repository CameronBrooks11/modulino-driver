# Codec vectors for Modulino Pixels (spec/nodes.toml kind "pixels").
#
# brightness_from_percent: 0-100 -> 0-31, rounding down, as Arduino_Modulino's
# map(brightness, 0, 100, 0, 0x1F).
# encode: eight LEDs -> 32 bytes, each LED [0xE0 | brightness, B, G, R]
# (main.c:307-309). `leds` lists LEDs by index; unlisted LEDs are off.

[[brightness_from_percent]]
args = { percent = 0 }
expect = 0

[[brightness_from_percent]]
args = { percent = 50 }
expect = 15

[[brightness_from_percent]]
args = { percent = 100 }
expect = 31

[[brightness_from_percent]]
args = { percent = 101 }
error = "out_of_range"

[[encode]]
leds = []
expect = [
  0xE0, 0x00, 0x00, 0x00, 0xE0, 0x00, 0x00, 0x00,
  0xE0, 0x00, 0x00, 0x00, 0xE0, 0x00, 0x00, 0x00,
  0xE0, 0x00, 0x00, 0x00, 0xE0, 0x00, 0x00, 0x00,
  0xE0, 0x00, 0x00, 0x00, 0xE0, 0x00, 0x00, 0x00,
]

[[encode]]
leds = [
  { index = 0, r = 0xFF, g = 0x00, b = 0x00, brightness = 31 },
  { index = 7, r = 0x01, g = 0x02, b = 0x03, brightness = 5 },
]
expect = [
  0xFF, 0x00, 0x00, 0xFF, 0xE0, 0x00, 0x00, 0x00,
  0xE0, 0x00, 0x00, 0x00, 0xE0, 0x00, 0x00, 0x00,
  0xE0, 0x00, 0x00, 0x00, 0xE0, 0x00, 0x00, 0x00,
  0xE0, 0x00, 0x00, 0x00, 0xE5, 0x03, 0x02, 0x01,
]

[[encode]]
leds = [{ index = 3, r = 0, g = 0, b = 0, brightness = 32 }]
error = "out_of_range"
