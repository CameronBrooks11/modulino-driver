name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Rustdoc lints (broken links) are warnings, and clippy does not run them.
  RUSTDOCFLAGS: -D warnings
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - command: check
            args: --all-targets
          - command: check
            args: --all-targets --features defmt
          - command: test
            args: --workspace
          - command: fmt
            args: --all -- --check
          - command: clippy
            args: --all-features --workspace -- -D warnings
          - command: doc
            args: --no-deps --all-features
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rust-src, rustfmt, clippy
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Run command
        run: cargo ${{ matrix.action.command }} ${{ matrix.action.args }}

  build-targets:
    name: Build for Targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - riscv32imac-unknown-none-elf    # ESP32-C3/C6
          - thumbv6m-none-eabi             # RP2040 (Cortex-M0+)
          - thumbv7em-none-eabihf          # STM32/Cortex-M4F
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Build library
        run: cargo check --target ${{ matrix.target }}
      - name: Build library with defmt
        run: cargo check --target ${{ matrix.target }} --features defmt

  # The declared rust-version (Cargo.toml), library only: the
  # dev-dependencies need a newer toolchain.
  msrv:
    name: MSRV (1.75)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.75"
      # No rust-cache here: its post step runs `cargo metadata`, which 1.75
      # cannot do for the dev-dependencies, so it would save nothing.
      # `+1.75` keeps the steps on 1.75 even if setting the default failed.
      - name: Check library
        run: cargo +1.75 check --lib
      - name: Check library with defmt
        run: cargo +1.75 check --lib --features defmt

  # The oldest toolchain the tests and examples build on, as README.md and
  # docs/bench.md state: the bench runs on a Pi that may not have the latest.
  dev-toolchain:
    name: Tests and examples (1.85)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.85"
      - name: Build tests and examples
        run: cargo +1.85 build --all-targets

  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # spec/nodes.toml against the node firmware at the commit it pins. The
  # second checkout reads the pin from the spec, so moving it is one edit.
  firmware-drift:
    name: Firmware drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Read the firmware pin
        id: pin
        run: echo "commit=$(sed -n '/^\[firmware\]/,/^\[/ s/^commit = "\(.*\)"$/\1/p' spec/nodes.toml)" >> "$GITHUB_OUTPUT"
      - name: Checkout node firmware at the pin
        uses: actions/checkout@v5
        with:
          repository: arduino/node_modulino_firmware
          ref: ${{ steps.pin.outputs.commit }}
          path: node_modulino_firmware
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Enable caching
        uses: Swatinem/rust-cache@v2
      - name: Compare
        run: cargo test --test firmware_drift -- --ignored
        env:
          FIRMWARE_DIR: node_modulino_firmware

  # The only check branch protection requires. Add every job to `needs`.
  ok:
    name: ok
    if: always()
    needs: [rust-checks, build-targets, msrv, dev-toolchain, security_audit, firmware-drift]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any upstream job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Pass
        run: echo 'All checks passed or were skipped'
